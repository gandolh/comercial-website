# PiațăRo's API. Build context is the repo root (..) because the image reads
# backend/ and .dockerignore sits there.
#
#   docker compose -f infrastructure/docker-compose.yml up -d piataro-api
#
# `.env` in THIS directory is written by the deploy (vps-deploy's `server`
# phase, 0600) and is read twice: compose interpolates ${...} below from it,
# and the service declares it as env_file so the same values reach the process.
# For a local run it needs JWT_SECRET at least; docs/deploy.md has the rest. It
# is git-ignored because it carries the JWT secret and the Ward client key.
services:
  piataro-api:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
      target: prod
    image: piataro-api:1.0
    ports:
      # LOOPBACK ONLY. Without the 127.0.0.1 prefix this would be published on
      # every interface, reachable over plain HTTP past Caddy and its TLS. The
      # server's HOST is 0.0.0.0 because that is inside the container's network
      # namespace; this line is what decides who can reach it.
      - "127.0.0.1:${PIATARO_PORT:-8807}:${PIATARO_PORT:-8807}"
    env_file:
      - .env
    # These beat env_file. A dev .env copied here (PORT=8080,
    # DATABASE_PATH=./data/...) would otherwise leave the server unreachable
    # from the published port, or writing outside /data. PORT follows
    # PIATARO_PORT so the publish line, the healthcheck and the listening port
    # always agree.
    environment:
      HOST: 0.0.0.0
      PORT: "${PIATARO_PORT:-8807}"
      DATABASE_PATH: /data/my-olx.db
      UPLOADS_DIR: /data/uploads
      ASSETS_DIR: /data/assets
    volumes:
      # The database and every file. Bind-mounted from the host so it survives
      # deploys and "back up PiațăRo" means one path. Defaults to a local dir so
      # a dev `compose up` works.
      - ${PIATARO_DATA_DIR:-../data}:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- \"http://127.0.0.1:${PIATARO_PORT:-8807}/health\""]
      interval: 30s
      timeout: 3s
      start_period: 10s
