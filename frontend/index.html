<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf8ff" />
    <title>PiațăRo — Anunțuri din toată România</title>
    <script>
      // The saved theme before the first paint, so a dark visitor never sees a light flash; light on a first visit.
      // The colours are the `background` role of each theme in src/index.css (src/core/lib/theme.test.ts checks).
      try {
        var saved = localStorage.getItem("theme");
        var dark = saved === "dark" || (saved === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#11131a" : "#faf8ff");
      } catch (error) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
